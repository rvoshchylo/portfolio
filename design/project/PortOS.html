<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #0d0d11;
    --card: rgba(255,255,255,0.04);
    --card-strong: rgba(255,255,255,0.07);
    --line: rgba(255,255,255,0.08);
    --text: #e8e8ee;
    --muted: #8b8b96;
    --blue: #5e9cf5;
    --purple: #a78bfa;
    --green: #34d399;
    --orange: #fb923c;
    --pink: #f472b6;
    --red: #ff5f57;
    --yellow: #febc2e;
    --grn: #28c840;
  }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace;
    font-feature-settings: "ss01","ss02","cv01";
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  *, *::before, *::after { box-sizing: border-box; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }

  /* Boot — laptop */
  .stage {
    perspective: 1600px;
    perspective-origin: 50% 60%;
  }
  .laptop {
    position: relative;
    width: 520px;
    transform-style: preserve-3d;
  }
  .laptop .base {
    height: 18px;
    background: linear-gradient(180deg, #2a2a32 0%, #1a1a20 60%, #0a0a0e 100%);
    border-radius: 4px 4px 14px 14px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.06);
    position: relative;
  }
  .laptop .base::after {
    content: ""; position: absolute; left: 50%; bottom: 2px;
    transform: translateX(-50%);
    width: 90px; height: 4px; border-radius: 4px;
    background: rgba(0,0,0,0.4);
  }
  .laptop .lid-wrap {
    position: absolute;
    bottom: 18px;
    left: 0; right: 0;
    transform-origin: bottom center;
    transform-style: preserve-3d;
    transition: transform 1200ms cubic-bezier(.22,.61,.36,1);
  }
  .laptop.closed .lid-wrap { transform: rotateX(-92deg); }
  .laptop.open .lid-wrap { transform: rotateX(0deg); }

  .laptop .lid {
    height: 320px;
    background: linear-gradient(180deg, #1c1c22 0%, #131318 100%);
    border-radius: 12px 12px 4px 4px;
    padding: 14px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 18px 50px rgba(0,0,0,0.6);
  }
  .laptop .screen {
    width: 100%; height: 100%;
    background: #000;
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    transition: filter 700ms ease, background 800ms ease;
  }
  .laptop.dark .screen { filter: brightness(0); }
  .laptop.lit .screen { filter: brightness(1); background: #0d0d11; }

  /* Diamond brand mark pulse */
  @keyframes brandPulse {
    0%, 100% { opacity: .55; transform: scale(1); filter: drop-shadow(0 0 18px rgba(167,139,250,.45)); }
    50% { opacity: 1; transform: scale(1.05); filter: drop-shadow(0 0 36px rgba(167,139,250,.85)); }
  }
  .brand-pulse { animation: brandPulse 1.6s ease-in-out infinite; }

  /* Password dots typing */
  @keyframes dotIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }
  .pwd-dot { animation: dotIn .25s ease both; }

  /* Caret */
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .caret { animation: blink 1s steps(2) infinite; }

  /* Wallpaper */
  .wallpaper {
    position: absolute; inset: 0;
    background:
      radial-gradient(60% 50% at 20% 20%, rgba(94,156,245,0.18) 0%, transparent 60%),
      radial-gradient(50% 50% at 85% 85%, rgba(167,139,250,0.20) 0%, transparent 60%),
      radial-gradient(120% 80% at 50% 50%, #15131f 0%, #0a0a10 70%, #06060a 100%);
  }
  .wallpaper::after {
    content: "";
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 22px 22px;
    background-position: 0 0;
    mask-image: radial-gradient(80% 70% at 50% 50%, black 40%, transparent 100%);
    opacity: .5;
    pointer-events: none;
  }
  .orb { position: absolute; border-radius: 9999px; filter: blur(80px); opacity: .55; pointer-events: none; }

  /* Frosted */
  .frost {
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    background: rgba(18, 18, 24, 0.55);
    border: 1px solid var(--line);
  }
  .frost-strong {
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    background: rgba(14,14,20,0.72);
    border: 1px solid var(--line);
  }

  /* Window spring */
  @keyframes winIn {
    0% { opacity: 0; transform: scale(.92); }
    60% { opacity: 1; transform: scale(1.012); }
    100% { opacity: 1; transform: scale(1); }
  }
  .win-in { animation: winIn .32s cubic-bezier(.2,.9,.3,1.2) both; }

  @keyframes winOut {
    from { opacity: 1; transform: scale(1); }
    to { opacity: 0; transform: scale(.94); }
  }
  .win-out { animation: winOut .18s ease both; }

  /* Dock hover scale */
  .dock-icon {
    transition: transform .18s cubic-bezier(.2,.9,.3,1.2), filter .18s;
  }
  .dock-icon:hover { transform: translateY(-10px) scale(1.18); }
  .dock-icon:active { transform: translateY(-4px) scale(1.06); }
  @keyframes bounceUp {
    0% { transform: translateY(0); }
    40% { transform: translateY(-22px); }
    70% { transform: translateY(-4px); }
    100% { transform: translateY(0); }
  }
  .dock-bounce { animation: bounceUp .55s cubic-bezier(.2,.9,.3,1.2); }

  /* Hint pulse */
  @keyframes hintPulse {
    0%, 100% { opacity: .35; }
    50% { opacity: .85; }
  }
  .hint { animation: hintPulse 2.4s ease-in-out infinite; }

  /* Faint scanline on boot screen */
  .scanlines::before {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }

  /* Project card hover */
  .proj-card { transition: transform .2s ease, border-color .2s ease, background .2s ease; }
  .proj-card:hover { transform: translateY(-3px); }

  /* Skill pill */
  .skill-pill { transition: background .15s, color .15s, border-color .15s, transform .15s; }
  .skill-pill:hover { transform: translateY(-1px); }

  /* utility */
  .no-select { user-select: none; -webkit-user-select: none; }
  .ring-line { box-shadow: inset 0 0 0 1px var(--line); }

  /* Fade base */
  .fade-in { animation: fade .5s ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .fade-out { animation: fadeo .5s ease both; }
  @keyframes fadeo { from { opacity: 1; } to { opacity: 0; } }

  /* Apple-key style for our diamond logo wordmark */
  .logo-glyph {
    width: 16px; height: 16px;
    display: inline-block;
    background: linear-gradient(135deg, #cdb9ff 0%, #6f5bd8 100%);
    transform: rotate(45deg);
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.22);
  }
</style>

/* ============================== BRAND MARK ============================== */

          <stop offset="0%" stopColor="#7fb6ff" />
          <stop offset="100%" stopColor="#5e9cf5" />
        </linearGradient>
      </defs>
      {/* Diamond split into two facets */}
      <g transform="translate(50 50) rotate(45)">
        <rect x="-26" y="-26" width="26" height="52" rx="4" fill="url(#bg1)" />
        <rect x="0"   y="-26" width="26" height="52" rx="4" fill="url(#bg2)" />

}

/* ============================== BOOT ============================== */
function BootSequence({ onDone }) {
  // stages: closed -> opening -> brand -> login -> done
  const [stage, setStage] = useState("closed");
  const [pwd, setPwd] = useState(0);
  const [shutdown, setShutdown] = useState(false);

  useEffect(() => {
    const t1 = setTimeout(() => setStage("opening"), 350);
    const t2 = setTimeout(() => setStage("brand"), 350 + 1200);   // lid done
    const t3 = setTimeout(() => setStage("login"), 350 + 1200 + 1600);
    return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
  }, []);

  // Password typing
  useEffect(() => {
    if (stage !== "login") return;
    let i = 0;
    const id = setInterval(() => {
      i++; setPwd(i);
      if (i >= 8) {
        clearInterval(id);
        setTimeout(() => setShutdown(true), 600);
        setTimeout(() => onDone && onDone(), 1200);
      }
    }, 180);
    return () => clearInterval(id);
  }, [stage, onDone]);

  const lidOpen = stage !== "closed";
  const lit = stage === "brand" || stage === "login";

  return (
    <div className={"absolute inset-0 grid place-items-center bg-black " + (shutdown ? "fade-out" : "")}
         style={{ animationDelay: shutdown ? "0ms" : undefined }}>
      <div className="stage">
        <div className={"laptop " + (lidOpen ? "open " : "closed ") + (lit ? "lit" : "dark")}>
          <div className="lid-wrap">
            <div className="lid">
              <div className="screen scanlines">
                {/* notch */}
                <div className="absolute left-1/2 -translate-x-1/2 top-0 w-20 h-2 bg-black rounded-b-[8px]" />
                {/* contents */}
                {stage === "brand" && (
                  <div className="absolute inset-0 grid place-items-center fade-in">
                    <BrandMark size={84} />
                  </div>
                )}
                {stage === "login" && (
                  <div className="absolute inset-0 flex flex-col items-center justify-center gap-3 px-6 fade-in">
                    <div className="w-16 h-16 rounded-full grid place-items-center text-xl"
                         style={{
                           background: "linear-gradient(135deg,#5e9cf5,#a78bfa)",
                           boxShadow: "0 0 0 2px rgba(255,255,255,0.18), 0 10px 24px rgba(0,0,0,0.5)",
                           color: "white", fontWeight: 700,
                         }}>
                      AK
                    </div>
                    <div className="text-[13px] font-semibold tracking-wide" style={{ color: "#f0f0f6" }}>Alex Kovalenko</div>
                    <div className="text-[10px]" style={{ color: "#8b8b96" }}>Fullstack Developer</div>
                    <div className="mt-2 px-3 py-1.5 rounded-full flex items-center gap-1.5"
                         style={{ background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.08)" }}>
                      {Array.from({ length: 8 }).map((_, i) => (
                        <span key={i}
                              className={i < pwd ? "pwd-dot" : ""}
                              style={{
                                width: 6, height: 6, borderRadius: 99,
                                background: i < pwd ? "#e8e8ee" : "rgba(255,255,255,0.18)",
                                display: "inline-block",
                              }} />
                      ))}
                      {pwd < 8 && (
                        <span className="caret" style={{ width: 1, height: 10, background: "#e8e8ee", marginLeft: 2 }} />
                      )}
                    </div>
                    <div className="text-[9px] mt-1" style={{ color: "#6b6b78" }}>authenticating…</div>
                  </div>
                )}
                {/* subtle vignette */}
                <div className="absolute inset-0 pointer-events-none"
                     style={{ background: "radial-gradient(120% 80% at 50% 50%, transparent 60%, rgba(0,0,0,0.4) 100%)" }} />
              </div>
            </div>
          </div>
          <div className="base" />
        </div>
        {stage === "closed" && (
          <div className="text-center mt-6 text-[10px]" style={{ color: "#5a5a66" }}>
            press any key to wake…
          </div>
        )}
      </div>
    </div>
  );
}

      </div>
    </div>
  );
}

/* ============================== WINDOW ============================== */
function AppWindow({ win, onClose, onFocus, onMinimize, children }) {
  const ref = useRef(null);
  const [pos, setPos] = useState(win.pos);
  const drag = useRef(null);

  const onMouseDown = (e) => {
    onFocus(win.id);
    const rect = ref.current.getBoundingClientRect();
    drag.current = { dx: e.clientX - rect.left, dy: e.clientY - rect.top };
    document.body.style.userSelect = "none";
  };

  useEffect(() => {
    const mv = (e) => {
      if (!drag.current) return;
      const nx = e.clientX - drag.current.dx;
      const ny = Math.max(28, e.clientY - drag.current.dy);
      setPos({ x: nx, y: ny });
    };
    const up = () => { drag.current = null; document.body.style.userSelect = ""; };
    window.addEventListener("mousemove", mv);
    window.addEventListener("mouseup", up);
    return () => {
      window.removeEventListener("mousemove", mv);
      window.removeEventListener("mouseup", up);
    };
  }, []);

  return (
    <div ref={ref}
         className={"absolute frost-strong rounded-[10px] overflow-hidden win-in"}
         style={{
           left: pos.x, top: pos.y,
           width: win.size.w, height: win.size.h,
           zIndex: win.z,
           boxShadow: "0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06)",
         }}
         onMouseDown={() => onFocus(win.id)}>
      {/* Titlebar */}
      <div className="flex items-center px-3 no-select"
           style={{
             height: 32,
             background: "rgba(10,10,14,0.75)",
             borderBottom: "1px solid rgba(255,255,255,0.06)",
             cursor: "grab",
           }}
           onMouseDown={onMouseDown}>
        <div className="flex items-center gap-2 group">
          <button onClick={(e) => { e.stopPropagation(); onClose(win.id); }}
                  title="close"
                  className="rounded-full"
                  style={{ width: 12, height: 12, background: "#ff5f57",
                           boxShadow: "inset 0 0 0 0.5px rgba(0,0,0,0.25)" }} />
          <button onClick={(e) => { e.stopPropagation(); onMinimize(win.id); }}
                  title="minimize"
                  className="rounded-full"
                  style={{ width: 12, height: 12, background: "#febc2e",
                           boxShadow: "inset 0 0 0 0.5px rgba(0,0,0,0.25)" }} />
          <button onClick={(e) => e.stopPropagation()}
                  title="maximize"
                  className="rounded-full"
                  style={{ width: 12, height: 12, background: "#28c840",
                           boxShadow: "inset 0 0 0 0.5px rgba(0,0,0,0.25)" }} />
        </div>
        <div className="absolute left-1/2 -translate-x-1/2 text-[12px] flex items-center gap-2"
             style={{ color: "#dcdce4" }}>
          <span className="text-[14px] leading-none">{win.icon}</span>
          <span className="font-semibold">{win.title}</span>
        </div>
      </div>
      {/* Body */}
      <div className="relative"
           style={{
             height: "calc(100% - 32px)",
             background: "linear-gradient(180deg, rgba(13,13,17,0.96) 0%, rgba(10,10,14,0.96) 100%)",
             overflowY: "auto",
           }}>
        {children}
      </div>
    </div>
  );
}

function FormInput({ value, onChange, placeholder, type = "text", multiline }) {
  const [focus, setFocus] = useState(false);
  const common = {
    value, placeholder,
    onChange: (e) => onChange(e.target.value),
    onFocus: () => setFocus(true),
    onBlur: () => setFocus(false),
    className: "w-full px-3 py-2 rounded-[6px] text-[12px] outline-none transition",
    style: {
      background: "rgba(0,0,0,0.25)",
      border: "1px solid " + (focus ? "rgba(94,156,245,0.5)" : "rgba(255,255,255,0.1)"),
      color: "#e8e8ee",
      fontFamily: "inherit",
    },
  };
  return multiline
    ? <textarea {...common} rows={4} style={{ ...common.style, resize: "vertical", minHeight: 90 }} />
    : <input {...common} type={type} />;
}

/* ============================== DESKTOP ============================== */
const APP_COMPONENTS = {
  about:    { title: "about.exe",    icon: "👤", size: { w: 520, h: 560 }, Comp: AboutApp },
  projects: { title: "projects.exe", icon: "📁", size: { w: 720, h: 540 }, Comp: ProjectsApp },
  skills:   { title: "skills.exe",   icon: "⚡", size: { w: 660, h: 480 }, Comp: SkillsApp },
  contact:  { title: "contact.exe",  icon: "✉", size: { w: 560, h: 580 }, Comp: ContactApp },
};

function Desktop() {
  const [wins, setWins] = useState([]);
  const [zTop, setZTop] = useState(10);
  const [bouncing, setBouncing] = useState({});
  const [hintGone, setHintGone] = useState(false);

  const open = (id) => {
    setHintGone(true);
    setBouncing(b => ({ ...b, [id]: Date.now() }));
    setTimeout(() => setBouncing(b => { const c = { ...b }; delete c[id]; return c; }), 600);
    setWins(curr => {
      const found = curr.find(w => w.id === id);
      const nz = zTop + 1;
      setZTop(nz);
      if (found) {
        return curr.map(w => w.id === id ? { ...w, z: nz, minimized: false } : w);
      }
      const meta = APP_COMPONENTS[id];
      // cascade
      const offset = curr.length * 28;
      return [...curr, {
        id, z: nz, minimized: false,
        title: meta.title, icon: meta.icon, size: meta.size,
        pos: { x: 220 + offset, y: 80 + offset },
      }];
    });
  };

  const focus = (id) => {
    setWins(curr => {
      const top = curr.find(w => w.id === id);
      if (!top) return curr;
      if (top.z === zTop) return curr;
      const nz = zTop + 1;
      setZTop(nz);
      return curr.map(w => w.id === id ? { ...w, z: nz } : w);
    });
  };

  const close = (id) => setWins(curr => curr.filter(w => w.id !== id));
  const minimize = (id) => setWins(curr => curr.map(w => w.id === id ? { ...w, minimized: true } : w));

  return (
    <div className="absolute inset-0 fade-in overflow-hidden">
      <div className="wallpaper" />
      {/* glow orbs */}
      <div className="orb" style={{ width: 380, height: 380, top: -100, left: -80, background: "#5e9cf5" }} />
      <div className="orb" style={{ width: 460, height: 460, bottom: -140, right: -120, background: "#a78bfa" }} />

      <Menubar />

      {/* Desktop icons */}
      <div className="absolute right-6 top-12 flex flex-col gap-5 z-10 no-select">
        {APPS.map(a => (
          <button key={a.id}
                  onDoubleClick={() => open(a.id)}
                  className="flex flex-col items-center gap-1.5 group"
                  style={{ width: 80 }}>
            <Glyph ch={a.label} bg={a.iconBg} />
            <div className="text-[11px] px-1.5 py-0.5 rounded"
                 style={{
                   color: "#e8e8ee",
                   background: "rgba(0,0,0,0.35)",
                   border: "1px solid rgba(255,255,255,0.06)",
                 }}>
              {a.name}
            </div>
          </button>
        ))}
      </div>

      {/* Hint */}
      {!hintGone && (
        <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 hint no-select text-center pointer-events-none">
          <div className="text-[13px]" style={{ color: "#bcbcc6" }}>
            double-click an icon to open
          </div>
          <div className="text-[10px] mt-1" style={{ color: "#6b6b78" }}>
            or pick from the dock below ↓
          </div>
        </div>
      )}

      {/* Windows */}
      {wins.filter(w => !w.minimized).map(w => {
        const meta = APP_COMPONENTS[w.id];
        const Comp = meta.Comp;
        return (
          <AppWindow key={w.id} win={w} onClose={close} onFocus={focus} onMinimize={minimize}>
            <Comp />
          </AppWindow>
        );
      })}

      {/* Dock */}
      <div className="absolute bottom-3 left-1/2 -translate-x-1/2 z-40">
        <div className="frost-strong rounded-[20px] px-3 py-2 flex items-end gap-3"
             style={{ boxShadow: "0 20px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.08)" }}>
          {APPS.map(a => {
            const isOpen = wins.some(w => w.id === a.id);
            const isBouncing = !!bouncing[a.id];
            return (
              <div key={a.id} className="flex flex-col items-center gap-1 no-select">
                <button
                  className={"dock-icon " + (isBouncing ? "dock-bounce" : "")}
                  onClick={() => open(a.id)}
                  title={a.name}>
                  <Glyph ch={a.label} bg={a.iconBg} />
                </button>
                <span style={{
                  width: 4, height: 4, borderRadius: 99,
                  background: isOpen ? "#e8e8ee" : "transparent",
                }} />
              </div>
            );
          })}
          {/* divider */}
          <div style={{ width: 1, height: 44, background: "rgba(255,255,255,0.08)", margin: "0 4px" }} />
          {/* trash */}
          <div className="flex flex-col items-center gap-1 no-select">
            <div className="dock-icon">
              <Glyph ch="🗑" bg="linear-gradient(135deg,#3a3a44,#222229)" />
            </div>
            <span style={{ width: 4, height: 4, borderRadius: 99, background: "transparent" }} />
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================== ROOT ============================== */
function App() {
  const [booted, setBooted] = useState(false);
  return (
    <div className="absolute inset-0">
      {booted && <Desktop />}
      {!booted && <BootSequence onDone={() => setBooted(true)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
